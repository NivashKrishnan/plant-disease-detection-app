<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Plant Disease Detector</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #eafff2;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 22px;
    padding: 32px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    background: linear-gradient(90deg, #6ee7b7, #34d399);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 6px;
  }
  .sub { color: #b7d9c8; font-size: 13px; margin-bottom: 22px; }
  .drop {
    border: 2px dashed rgba(110,231,183,0.4);
    border-radius: 16px;
    padding: 28px;
    text-align: center;
    cursor: pointer;
    transition: 0.25s;
    background: rgba(255,255,255,0.03);
  }
  .drop:hover { border-color: #6ee7b7; background: rgba(110,231,183,0.06); }
  .drop.dragover { border-color: #34d399; background: rgba(52,211,153,0.12); }
  .drop p { font-size: 14px; color: #cdeee0; }
  .drop span { font-size: 12px; color: #8fb7a6; }
  input[type=file] { display: none; }
  #preview {
    display: none;
    width: 100%;
    max-height: 260px;
    object-fit: contain;
    border-radius: 14px;
    margin-top: 16px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  button {
    width: 100%;
    margin-top: 18px;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #34d399, #10b981);
    color: #05271a;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(52,211,153,0.35); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #result {
    display: none;
    margin-top: 22px;
    background: rgba(0,0,0,0.25);
    border-radius: 14px;
    padding: 18px 20px;
    border: 1px solid rgba(255,255,255,0.1);
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .loading { display: none; text-align: center; margin-top: 18px; color: #9fe0c0; font-size: 14px; }
  .dot { display: inline-block; width: 6px; height: 6px; background: #34d399; border-radius: 50%; margin: 0 2px; animation: blink 1.4s infinite both; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }
  .badge { display: inline-block; background: rgba(52,211,153,0.18); color: #6ee7b7; padding: 3px 10px; border-radius: 20px; font-size: 11px; margin-bottom: 10px; }
  .err { color: #f87171; margin-top: 12px; font-size: 13px; display: none; }
</style>
</head>
<body>
<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:flex-start;">
    <div>
      <h1>🌿 AI plant disease detector</h1>
      <p class="sub">Upload a leaf photo — AI will identify the disease and suggest treatment</p>
    </div>
    <select id="langSel" style="background:rgba(255,255,255,0.08); color:#eafff2; border:1px solid rgba(255,255,255,0.2); border-radius:8px; padding:6px 8px; font-size:12px;">
      <option value="en">English</option>
      <option value="ta">தமிழ்</option>
    </select>
  </div>

  <input type="password" id="apiKey" placeholder="Paste your free Gemini API key" style="width:100%; margin-top:14px; padding:11px; border-radius:10px; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.06); color:#eafff2; font-size:13px;">
  <p style="font-size:11px; color:#6b8f7c; margin-top:6px;">Get a free key at <span style="color:#6ee7b7;">aistudio.google.com/apikey</span> — stored only in this browser tab.</p>

  <div class="drop" id="dropzone">
    <p><b>Click to upload</b> or drag & drop</p>
    <span>JPG, PNG — clear photo of the affected leaf</span>
  </div>
  <input type="file" id="fileInput" accept="image/*">
  <img id="preview">

  <button id="analyzeBtn" disabled>Analyze leaf</button>
  <div class="loading" id="loading">Analyzing<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="err" id="err"></div>
  <div id="result"></div>

  <div style="margin-top:24px; border-top:1px solid rgba(255,255,255,0.12); padding-top:14px;">
    <p style="font-size:13px; color:#9fe0c0; margin-bottom:10px;">Recent scans</p>
    <div id="history" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>
</div>

<script>
// Polyfill window.storage using localStorage if not natively available
if (!window.storage) {
  window.storage = {
    get: async (key, isGlobal) => {
      const val = localStorage.getItem(key);
      return val ? { value: val } : null;
    },
    set: async (key, val, isGlobal) => {
      localStorage.setItem(key, val);
    }
  };
}

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const analyzeBtn = document.getElementById('analyzeBtn');
const resultDiv = document.getElementById('result');
const loading = document.getElementById('loading');
const errDiv = document.getElementById('err');

let base64Data = '';
let mediaType = '';
const langSel = document.getElementById('langSel');
const historyDiv = document.getElementById('history');
const apiKeyInput = document.getElementById('apiKey');
const savedKey = localStorage.getItem('gemini_key');
if (savedKey) apiKeyInput.value = savedKey;
apiKeyInput.addEventListener('change', () => localStorage.setItem('gemini_key', apiKeyInput.value.trim()));

async function loadHistory() {
  try {
    const res = await window.storage.get('scan-history', false);
    const items = res ? JSON.parse(res.value) : [];
    renderHistory(items);
  } catch { renderHistory([]); }
}

function renderHistory(items) {
  historyDiv.innerHTML = '';
  if (!items.length) {
    historyDiv.innerHTML = '<p style="font-size:12px; color:#6b8f7c;">No scans yet</p>';
    return;
  }
  items.slice(0, 5).forEach(it => {
    const row = document.createElement('div');
    row.style.cssText = 'background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:8px 12px; font-size:12px; color:#cdeee0;';
    row.textContent = it.summary + '  ·  ' + it.date;
    historyDiv.appendChild(row);
  });
}

async function saveToHistory(summary) {
  try {
    const res = await window.storage.get('scan-history', false).catch(() => null);
    const items = res ? JSON.parse(res.value) : [];
    items.unshift({ summary, date: new Date().toLocaleDateString() });
    await window.storage.set('scan-history', JSON.stringify(items.slice(0, 20)), false);
    renderHistory(items);
  } catch (e) { console.error('history save failed', e); }
}

loadHistory();

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

function handleFile(file) {
  if (!file.type.startsWith('image/')) return;
  mediaType = file.type;
  const reader = new FileReader();
  reader.onload = e => {
    base64Data = e.target.result.split(',')[1];
    preview.src = e.target.result;
    preview.style.display = 'block';
    analyzeBtn.disabled = false;
    resultDiv.style.display = 'none';
    errDiv.style.display = 'none';
  };
  reader.readAsDataURL(file);
}

analyzeBtn.addEventListener('click', async () => {
  if (!base64Data) return;
  const key = apiKeyInput.value.trim();
  if (!key) {
    errDiv.textContent = 'Paste your free Gemini API key first (get one at aistudio.google.com/apikey).';
    errDiv.style.display = 'block';
    return;
  }
  analyzeBtn.disabled = true;
  loading.style.display = 'block';
  resultDiv.style.display = 'none';
  errDiv.style.display = 'none';

  const promptText = (langSel.value === 'ta'
    ? "நீங்கள் ஒரு வேளாண் தாவர நோயியல் நிபுணர். இந்த இலை புகைப்படத்தை பாருங்கள். இந்த வடிவத்தில் முழுவதும் தமிழில் பதிலளிக்கவும் (markdown குறியீடுகள் வேண்டாம்):\n\nதாவரம்: <தெரிந்தால் பெயர், இல்லையெனில் 'தெளிவாக இல்லை'>\nநோய்: <நோயின் பெயர், நோய் இல்லையெனில் 'ஆரோக்கியமாக உள்ளது'>\nநம்பகத்தன்மை: <அதிக/நடுத்தர/குறைவு>\nஅறிகுறிகள்: <ஒரு சிறு வரி>\nசிகிச்சை: <2-3 குறுகிய நடவடிக்கை படிகள்>\nதடுப்பு: <1-2 சிறு குறிப்புகள்>\n\nபடம் இலை இல்லையென்றால், அதை தெளிவாக கூறவும்."
    : "You are an agricultural plant pathologist. Look at this leaf photo. Respond in this exact plain-text format (no markdown symbols):\n\nPLANT: <plant name if identifiable, else 'unclear'>\nDISEASE: <disease name, or 'appears healthy' if no disease visible>\nCONFIDENCE: <High/Medium/Low>\nSYMPTOMS: <one short line of visible symptoms>\nTREATMENT: <2-3 concise actionable treatment/pesticide steps>\nPREVENTION: <1-2 short prevention tips>\n\nIf the image is not a plant leaf at all, say so clearly instead.");

  try {
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{
          parts: [
            { text: promptText },
            { inline_data: { mime_type: mediaType, data: base64Data } }
          ]
        }]
      })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data?.error?.message || 'API request failed');

    const textBlocks = data?.candidates?.[0]?.content?.parts?.map(p => p.text).filter(Boolean).join('\n') || 'No response from model.';
    resultDiv.innerHTML = '<span class="badge">Analysis complete</span>\n' + textBlocks;
    resultDiv.style.display = 'block';

    const firstLine = textBlocks.split('\n').find(l => l.trim().length) || 'Scan result';
    saveToHistory(firstLine.slice(0, 60));
  } catch (err) {
    errDiv.textContent = 'Error: ' + err.message;
    errDiv.style.display = 'block';
  } finally {
    loading.style.display = 'none';
    analyzeBtn.disabled = false;
  }
});
</script>
</body>
</html>
